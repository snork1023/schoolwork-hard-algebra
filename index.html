<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Drive - Google Drive</title>
    <meta name="author" content="snorkthedork" />
    <meta property="og:title" content="My Drive - Google Drive">
    <meta name="description" content="Zero limits, pushing boundaries">
    <meta property="og:description" content="Zero limits, pushing boundaries">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta property="og:type" content="website">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored === 'dark'
            || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            || !stored; // no stored value yet → defaultTheme="dark"
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
